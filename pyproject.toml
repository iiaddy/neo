[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-agent"
version = "0.1.0"
description = "neo — autonomous terminal coding agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=8",
    "httpx>=0.27",
]

[project.scripts]
neo = "neo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neo = ["templates/**/*", "tui/themes/*.json", "providers/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
